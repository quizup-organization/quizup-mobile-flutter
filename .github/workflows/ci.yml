name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Reject legacy design imports
        run: |
          if grep -R -n -E "package:flutter/(material|cupertino)\\.dart" lib test; then
            echo "Legacy Material/Cupertino imports found."
            echo "Use package:material_ui/material_ui.dart and package:cupertino_ui/cupertino_ui.dart."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Widget test
        run: flutter test test/widget_test.dart

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: quizup-flutter-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  goldens:
    name: Golden screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate screenshots
        run: flutter test test/golden --update-goldens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quizup-flutter-goldens
          path: test/golden/goldens
          retention-days: 14

  ios-simulator:
    name: iOS simulator screenshot
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign

      - name: Boot iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Simulator: $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Install and launch
        run: |
          xcrun simctl install "$SIMULATOR_ID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$SIMULATOR_ID" fr.cnadjim.quizup
          sleep 6
          mkdir -p docs/screenshots
          xcrun simctl io "$SIMULATOR_ID" screenshot docs/screenshots/ios-home.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quizup-flutter-ios-screenshot
          path: docs/screenshots
          retention-days: 14

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href /quizup-mobile-flutter/

      - uses: actions/upload-artifact@v4
        with:
          name: quizup-flutter-web
          path: build/web
          retention-days: 14

  deploy-pages:
    name: Deploy web preview
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quizup-flutter-web
          path: build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
